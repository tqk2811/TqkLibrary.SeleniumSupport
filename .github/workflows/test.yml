name: Test

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # No test project runs on CI (the repo only has a browser-driven Demo app): this job is a build gate.
      # Skip GitVersion: it fails on branches without a full SemVer tag.
      - name: Build
        shell: pwsh
        run: |
          foreach ($p in "TqkLibrary.SeleniumSupport", "TqkLibrary.SeleniumSupport.Windows") {
            dotnet build "$p/$p.csproj" -c Release -p:DisableGitVersionTask=true -p:Version=0.0.0
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
